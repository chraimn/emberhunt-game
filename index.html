<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#120e14"><meta name="description" content="竖屏 3 分钟割草游戏"><style>body{margin:0}[hidden]{display:none!important}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}html{box-sizing:border-box}</style></head><body><title>烬野猎人</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* 布局：手机竖屏一列。像素战场铺满整个屏幕，界面是浮在上面的深色描金面板，标题用宋体。 */
:root {
  color-scheme: dark;
  --ink: #120e14;
  --panel: rgba(26, 20, 27, 0.92);
  --panel-2: #2a2029;
  --line: #4a3d44;
  --gilt: #d8b56a;
  --gilt-dim: #8a744a;
  --parch: #efe3c6;
  --muted: #ab9c84;
  --danger: #e0664a;
  --good: #9fd88a;
  --display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --body: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--parch); font-family: var(--body); font-size: 14px; line-height: 1.5; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 2px; }
button:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }
button:disabled { opacity: 0.38; cursor: default; }
h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; background: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#screen, #hud, #modal { position: absolute; inset: 0; }

/* 营地 */
.camp { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 14px 12px; background: linear-gradient(rgba(18, 14, 20, 0.3), rgba(18, 14, 20, 0.78) 40%); }
.camp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.camp-h h1 { font-family: var(--display); font-weight: 900; font-size: 28px; letter-spacing: 0.14em; color: var(--gilt); text-shadow: 0 2px 0 #000; }
.res { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.res b { color: var(--parch); font-size: 15px; font-family: var(--display); }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 0; font-family: var(--display); font-size: 15px; letter-spacing: 0.1em; text-indent: 0.1em; color: var(--muted); }
.tab.on { color: var(--gilt); border-bottom-color: var(--gilt); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; scrollbar-width: none; }
.stage, .slot, .talent { background: var(--panel); border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.stage.sel { border-color: var(--gilt); box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 4px var(--gilt-dim); }
.stage.locked { opacity: 0.6; }
.stage header, .slot-h, .item-h, .shards { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h3 { font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: 0.06em; }
.stage header span, .lockline, .note, .muted, .sub { color: var(--muted); font-size: 12px; }
.tiers { display: flex; gap: 6px; }
.tier { flex: 1; min-width: 0; height: 36px; background: none; border: 1px solid var(--gilt-dim); font-family: var(--display); font-size: 15px; color: var(--parch); }
.tier.done { border-bottom: 3px solid var(--good); }
.tier.on { background: var(--gilt); color: var(--ink); border-color: var(--gilt); font-weight: 900; }
.drops { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.drops li { min-width: 0; display: flex; gap: 5px; align-items: baseline; flex-wrap: wrap; }
.drops i { font-style: normal; font-size: 10px; border: 1px solid var(--line); padding: 0 3px; }
.drops em { font-style: normal; font-size: 10px; color: var(--gilt-dim); }
.drops u { text-decoration: none; font-size: 10px; color: var(--good); }
.drops .own { color: var(--parch); }
.shards { font-size: 12px; color: var(--muted); align-items: center; font-variant-numeric: tabular-nums; }
.shards b { color: var(--parch); font-size: 14px; }
.craftlist, .invact { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.mini { background: none; border: 1px solid var(--gilt-dim); padding: 6px 10px; font-size: 12px; color: var(--parch); white-space: nowrap; }
.mini.gold { background: var(--gilt); color: var(--ink); border-color: var(--gilt); font-weight: 700; }
.mini.wide { width: 100%; padding: 11px; }
.cta { width: 100%; border: 1px solid #f3dca2; background: linear-gradient(#e6c57c, #b98f45); color: #20160c; font-family: var(--display); font-weight: 900; font-size: 17px; letter-spacing: 0.1em; padding: 14px 10px; box-shadow: 0 3px 0 #5a4320; }
.cta:active { transform: translateY(2px); box-shadow: 0 1px 0 #5a4320; }
.item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.item-h b { font-family: var(--display); font-size: 16px; }
.tierbadge { font-size: 11px; color: var(--gilt); border: 1px solid var(--gilt-dim); padding: 0 6px; white-space: nowrap; }
.affix { font-size: 13px; color: var(--parch); }
.item.empty .affix { color: var(--muted); }
.attrs { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--good); font-variant-numeric: tabular-nums; }
.attrs li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.invlist { display: flex; flex-direction: column; gap: 10px; }
.inv { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.inv.eq .item-h b { color: var(--gilt); }
.talent { flex-direction: row; justify-content: space-between; align-items: center; }
.pips { display: flex; gap: 4px; margin-top: 6px; }
.pips i { width: 18px; height: 5px; background: var(--line); }
.pips i.on { background: var(--gilt); }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--gilt-dim); padding: 8px 14px; font-size: 13px; white-space: nowrap; pointer-events: none; }

/* 羁绊、套装、宝珠 */
.tr { --c: var(--muted); display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 6px; border: 1px solid var(--c); color: var(--c); background: rgba(18, 14, 20, 0.7); white-space: nowrap; opacity: 0.62; font-variant-numeric: tabular-nums; }
.tr.on { opacity: 1; background: color-mix(in srgb, var(--c) 22%, #120e14); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.settag { font-size: 11px; color: var(--good); border: 1px solid #55764a; padding: 0 6px; white-space: nowrap; }
.socket { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.orbpick { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }
.setrow { display: flex; flex-direction: column; gap: 4px; }
.setrow > b { font-family: var(--display); font-size: 15px; }
.bonus { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.bonus li { display: grid; grid-template-columns: 4.6em 1fr; gap: 8px; }
.bonus li i { font-style: normal; color: var(--gilt-dim); }
.bonus li.on { color: var(--parch); }
.bonus li.on i { color: var(--gilt); }
.sub2 { font-size: 11px; color: var(--gilt-dim); letter-spacing: 0.1em; display: flex; gap: 8px; flex-wrap: wrap; }
.rowval { color: var(--muted); letter-spacing: 0; }
.rowval b { color: var(--parch); }
.summary { border-color: var(--gilt-dim); }
.rarbadge { font-size: 11px; border: 1px solid; padding: 0 6px; white-space: nowrap; }
.doll { display: flex; gap: 14px; align-items: center; }
.doll > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dollimg { flex: none; width: 104px; height: 76px; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; background: radial-gradient(closest-side, rgba(216, 181, 106, 0.22), transparent); }
.cls .dollimg { width: 66px; height: 84px; object-fit: cover; }
.hub { height: 100%; position: relative; padding-block: 14px 12px; pointer-events: none; }
.hub button { pointer-events: auto; }
.hub .camp-h h1 { text-shadow: 0 2px 0 #000, 0 0 12px #000; }
.hub .res { text-shadow: 0 1px 0 #000, 0 0 6px #000; }
#hublabels { position: absolute; inset: 0; overflow: hidden; }
.hl { position: absolute; left: 0; top: 0; font-family: var(--display); font-size: 12px; letter-spacing: 0.1em; color: var(--parch); background: rgba(18, 14, 20, 0.72); border: 1px solid var(--line); padding: 0 6px; white-space: nowrap; will-change: transform; }
.hl.on { color: var(--ink); background: var(--gilt); border-color: var(--gilt); }
.hl .dot { margin-left: 4px; color: #ff7a5a; }
.hl.on .dot { color: #8a1c0c; }
#hubprompt { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: 26px; width: auto; }
#hubhint { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 13px; color: var(--parch); text-shadow: 0 1px 0 #000, 0 0 6px #000; }
.hub .toast { bottom: 100px; }
.ptitle { font-family: var(--display); font-size: 22px; font-weight: 900; letter-spacing: 0.2em; color: var(--gilt); flex: 1; }
.camp .camp-h { align-items: center; flex-wrap: nowrap; }
.crys { display: flex; flex-direction: column; gap: 8px; }
.cry { display: flex; align-items: center; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.cry b { font-family: var(--display); font-size: 16px; font-variant-numeric: tabular-nums; }
.cry .mini { margin-left: auto; }
.wname { font-family: var(--display); font-size: 17px; }
.warn { color: var(--danger); }
.up { color: var(--good); font-weight: 400; }
.qbar { height: 6px; background: var(--line); }
.qbar i { display: block; height: 100%; background: var(--gilt); }
.dollimg.big { width: 130px; height: 95px; }
.toast.good { border-color: var(--good); color: var(--good); }
.toast.bad { border-color: var(--danger); color: var(--danger); }
/* 装备：纸娃娃和背包格子 */
.dpanel { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; background: var(--panel); border: 1px solid var(--gilt-dim); box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 4px rgba(216, 181, 106, 0.25); padding: 12px 10px; }
.dcol { display: flex; flex-direction: column; gap: 6px; }
.dmid { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-width: 0; text-align: center; background: radial-gradient(closest-side at 50% 40%, rgba(216, 181, 106, 0.2), transparent); }
.dhero { width: 100%; max-width: 156px; aspect-ratio: 34 / 23; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; margin-block: auto; }
.drow { display: flex; gap: 6px; margin-top: 8px; }
.sbox { --rc: var(--line); position: relative; width: 54px; height: 54px; padding: 0; background: #17121a; border: 2px solid var(--rc); display: grid; place-items: center; }
.sbox img { width: 36px; height: 36px; image-rendering: pixelated; image-rendering: crisp-edges; }
.sbox small { position: absolute; left: 0; right: 0; bottom: -1px; font-size: 9px; line-height: 1.3; color: var(--muted); background: rgba(18, 14, 20, 0.82); white-space: nowrap; overflow: hidden; }
.sbox.empty { border-style: dashed; }
.sglyph { font-family: var(--display); font-size: 20px; color: var(--line); padding-bottom: 8px; }
.sbox.sel, .cell.sel .cicon { outline: 2px solid var(--gilt); outline-offset: 1px; box-shadow: 0 0 10px rgba(216, 181, 106, 0.6); }
.treebox { padding: 6px 0; align-items: center; background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--c, #d8b56a) 12%, transparent), transparent 70%), var(--panel) !important; }
.tree { position: relative; width: 320px; height: 500px; }
.tlines { position: absolute; inset: 0; width: 320px; height: 500px; }
.tlines line { stroke: #3a2f3d; stroke-width: 3; stroke-linecap: round; }
.tlines line.open { stroke: #6a5a4a; stroke-dasharray: 2 6; }
.tlines line.lit { stroke: var(--gilt); filter: drop-shadow(0 0 3px #d8b56a); }
.tgate { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 1px 8px; border-radius: 8px; background: #1b1420; border: 1px solid #3a2f3d; z-index: 1; font-size: 10px; letter-spacing: 1px; color: #6f6672; pointer-events: none; }
.tgate.on { color: var(--gilt); }
.tn { position: absolute; transform: translate(-50%, -50%); background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; width: 96px; height: 72px; display: block; }
.tframe { position: absolute; left: 50%; top: 24px; transform: translate(-50%, -50%); width: 42px; height: 42px; border-radius: 8px; background: #120d16; border: 2px solid #4a3f4e; display: grid; place-items: center; box-shadow: inset 0 2px 5px #000, 0 2px 4px #0008; }
.tframe img { width: 28px; height: 28px; image-rendering: pixelated; filter: grayscale(1) brightness(0.6); }
.tn.pk .tframe { width: 50px; height: 50px; border-radius: 50%; border-width: 3px; border-style: double; }
.tn.ult .tframe { width: 56px; height: 56px; border-radius: 50%; border-width: 3px; border-style: double; }
.tn.pk .tframe img { width: 32px; height: 32px; }
.tn.ult .tframe img { width: 36px; height: 36px; }
.tn:not(.locked) .tframe { border-color: #8a7a5a; }
.tn:not(.locked) .tframe img { filter: grayscale(0.55) brightness(0.85); }
.tn.on .tframe { border-color: var(--gilt); background: radial-gradient(color-mix(in srgb, var(--c) 35%, #120d16), #120d16 75%); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent), inset 0 2px 5px #000; }
.tn.on .tframe img { filter: none; }
.tn.dim { opacity: 0.55; }
.tn.locked { opacity: 0.6; }
.tn.sel .tframe { outline: 2px solid #fff; outline-offset: 2px; }
.tn:active .tframe { transform: translate(-50%, -50%) scale(0.94); }
.trk { position: absolute; left: calc(50% + 12px); top: 34px; font-size: 10px; font-weight: 700; padding: 0 4px; border-radius: 6px; background: #0b080e; border: 1px solid #5a4a3a; color: #c9c4b8; }
.tn.on .trk { color: #1a1220; background: var(--gilt); border-color: var(--gilt); }
.tn.pk .trk, .tn.ult .trk { left: calc(50% + 16px); top: 40px; }
.tname { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 11px; color: #a79fa8; white-space: nowrap; }
.tn.ult .tname { bottom: -8px; }
.tn.on .tname { color: var(--gilt); }
.tdetail { position: sticky; bottom: 0; z-index: 1; border-color: var(--gilt) !important; box-shadow: 0 -6px 14px #000a !important; background: #1b1420 !important; }
.tdh { display: flex; gap: 12px; align-items: flex-start; }
.tframe.big { position: static; transform: none; flex: none; width: 52px; height: 52px; border-color: var(--gilt); }
.tframe.big img { width: 36px; height: 36px; filter: none; }
.tdmain { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.bagtabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 3px; border-radius: 8px; background: #0f0b13; border: 1px solid #3a2f3d; }
.bagtab { background: none; border: 0; border-radius: 6px; padding: 7px 2px; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 4px; }
.bagtab i { font-style: normal; font-size: 10px; padding: 0 5px; border-radius: 8px; background: #2a2230; color: #a79fa8; }
.bagtab.on { background: linear-gradient(#3a2c1c, #241a14); color: var(--gilt); box-shadow: inset 0 0 0 1px #6a5a3a; }
.bagtab.on i { background: var(--gilt); color: #1a1220; }
.eqtag.lv { left: 2px; right: auto; top: 2px; bottom: auto; background: #0b080e; color: var(--gilt); border: 1px solid #6a5a3a; }
.bagtabs.two { grid-template-columns: 1fr 1fr; }
.aft { font-style: normal; font-size: 9.5px; font-weight: 700; padding: 0 4px; margin-right: 5px; border-radius: 3px; border: 1px solid currentColor; }
.afl span { font-size: 12px; }
.afbox { gap: 8px; }
.affull { font-size: 14px; }
.afrow { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; padding: 8px; border-radius: 8px; border: 1px solid #3a2f3d; background: #17111c; }
.afrow.locked { border-color: var(--gilt); background: linear-gradient(#241c14, #17111c); }
.afrow.rolling { border-style: dashed; border-color: #c9a8ff; }
.aftype { align-self: start; font-size: 10px; padding: 1px 5px; border-radius: 3px; color: #1a1220; font-weight: 700; }
.aftype.pre { background: #e0664a; }
.aftype.suf { background: #8fd8ff; }
.afmain, .afopt { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; min-width: 0; }
.afname { font-size: 13px; font-weight: 700; }
.aftext { grid-column: 1 / 3; font-size: 12px; color: #d9d2c4; }
.afbar { height: 4px; border-radius: 2px; background: #0b080e; border: 1px solid #3a2f3d; overflow: hidden; min-width: 60px; }
.afbar i { display: block; height: 100%; }
.afmain .tnext, .afopt .tnext { text-align: right; white-space: nowrap; }
.afmain .afname, .afopt .afname { grid-column: 1 / 3; }
.afact { grid-column: 1 / 3; display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.afpend { border-color: #c9a8ff !important; box-shadow: 0 0 14px #b48cff55 !important; }
.afopt { text-align: left; padding: 9px; border-radius: 8px; border: 1px solid #5a4a6e; background: #1b1424; color: inherit; font: inherit; cursor: pointer; width: 100%; box-sizing: border-box; }
.afopt:active { transform: translateY(1px); }
.afopt .tstate { grid-column: 1 / 3; margin: 0; }
.matpick { display: flex; flex-direction: column; gap: 5px; }
.matchip { display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; align-items: center; text-align: left; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a2f3d; background: #17111c; color: inherit; font: inherit; cursor: pointer; }
.matchip .ico24 { grid-row: 1 / 3; }
.matchip.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 8px color-mix(in srgb, var(--c) 50%, transparent); }
.ulthint { display: block; font-size: 10.5px; color: #ff9a2e; }
.legtrait { color: #ff9a2e !important; display: flex; align-items: center; gap: 6px; }
.sbanner { position: relative; margin: -2px -2px 6px; border-radius: 7px; overflow: hidden; border: 1px solid #0008; }
.sbanner img { display: block; width: 100%; aspect-ratio: 168 / 68; image-rendering: pixelated; }
.sbt { position: absolute; left: 10px; top: 8px; display: flex; align-items: center; gap: 6px; }
.sbt h3 { margin: 0; font-size: 18px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px #000; letter-spacing: 2px; }
.stag { font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--c); color: var(--c); background: #000a; }
.stag.sec { --c: #ff9a2e; }
.sbb { position: absolute; left: 10px; bottom: 7px; display: flex; flex-direction: column; text-shadow: 0 1px 0 #000, 0 0 6px #000; }
.sbb b { font-size: 12.5px; color: #ffe9b8; }
.sbb small { font-size: 10px; color: #d9d2c4; }
.stage.locked .sbanner img { filter: grayscale(1) brightness(0.45); }
.stage.secret { border-color: #ff9a2e88 !important; }
.slore { font-size: 12px; font-style: italic; color: #c9c0b0; margin: 0 0 6px; line-height: 1.5; }
.sechead { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.sechead h3 { margin: 0; color: #ff9a2e; letter-spacing: 3px; }
.sechead .mini { margin-left: auto; }
.flavor { display: block; font-size: 11.5px; font-style: italic; color: #a89f8c; line-height: 1.5; margin: 2px 0; }
.story p { font-size: 13.5px; line-height: 1.75; margin: 8px 0; text-align: left; }
.btg { font-size: 11px; letter-spacing: 2px; color: var(--gilt); margin: 2px 0 -4px; }
.btgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bt { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 8px; row-gap: 4px; align-items: center; text-align: left; padding: 8px; border-radius: 8px; border: 1px solid #3a2f3d; background: #17111c; color: inherit; font: inherit; cursor: pointer; min-width: 0; }
.bt:active:not(:disabled) { transform: translateY(1px); }
.bt:disabled { opacity: 1; filter: none; cursor: default; }
.bt .tframe { position: static; transform: none; width: 38px; height: 38px; grid-row: 1 / 3; }
.bt .tframe img { width: 26px; height: 26px; filter: grayscale(0.5) brightness(0.85); }
.bt.on { border-color: #6a5a3a; }
.bt.on .tframe { border-color: var(--gilt); }
.bt.on .tframe img { filter: none; }
.btmain { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.btmain b { font-size: 12.5px; }
.btlv { font-weight: 400; font-size: 10.5px; color: var(--muted); }
.bt .pips { margin-top: 2px; }
.bt .pips i { width: 12px; height: 4px; }
.btcost { grid-column: 2; display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--gilt); }
.bt:disabled:not(.max) .btcost { color: #8a5a5a; }
.bt.max .btcost { color: var(--muted); font-weight: 400; }
.ico16 { width: 14px; height: 14px; image-rendering: pixelated; }
.tpbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tpnum { font-size: 22px; color: var(--gilt); }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tgrid.one { grid-template-columns: 1fr; }
.tnode { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 9px 10px; border-radius: 8px; border: 1px solid #3a2f3d; background: #17111c; color: inherit; font: inherit; cursor: pointer; min-width: 0; }
.tnode:active:not(:disabled) { transform: translateY(1px); }
.tnode:disabled { cursor: default; opacity: 1; filter: none; }
.tnode.on { border-color: var(--gilt); background: linear-gradient(#2a2018, #17111c); }
.tnode.key { border-style: double; border-width: 3px; }
.tnode.key.on { box-shadow: 0 0 10px #d8b56a55; }
.tnode.dim:disabled, .tnode.dim { opacity: 0.6; }
.ttier.locked .tnode:disabled { opacity: 0.45; }
.thead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.thead b { font-size: 13px; }
.tnode.on .thead b { color: var(--gilt); }
.thead .pips { margin: 0 0 0 auto; }
.thead .pips i { width: 10px; }
.tplay { font-size: 10px; padding: 1px 5px; border-radius: 3px; border: 1px solid #6a58b8; color: #c9a8ff; }
.tstate { margin-left: auto; font-size: 10px; color: var(--muted); }
.tstate.on { color: var(--gilt); }
.ttext { font-size: 11.5px; line-height: 1.45; color: #d9d2c4; }
.tnext { font-size: 10.5px; color: var(--muted); }
.orbdots { position: absolute; left: 3px; top: 3px; display: flex; gap: 1px; }
.orbdots i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid #000; }
.sockh { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--gold, #d8b56a); margin-top: 8px; }
.sockh .muted { font-size: 11px; text-align: right; }
.socks, .gempick { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
.sock, .gemopt, .gemrow { display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; align-items: center; text-align: left; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a2f3d; background: #17111c; color: inherit; font: inherit; width: 100%; box-sizing: border-box; }
button.sock, button.gemopt { cursor: pointer; }
button.sock:active, button.gemopt:active { transform: translateY(1px); }
.sock.full { border-color: #5a4a3a; background: linear-gradient(#211824, #17111c); }
.sock.open { border-color: #d8b56a; box-shadow: 0 0 0 1px #d8b56a55; }
.sock .ico24, .gemopt .ico24, .sock .hole { grid-row: 1 / 3; }
.hole { width: 18px; height: 18px; margin: 3px; border-radius: 50%; background: #0b080e; border: 1px dashed #5a4a5e; box-shadow: inset 0 2px 3px #000; }
.gname { font-size: 12px; font-weight: 700; }
.gtext { font-size: 11px; color: var(--muted); grid-column: 2; }
.gempick { padding: 6px; border: 1px solid #d8b56a55; border-radius: 6px; background: #100b14; }
.gemrow { grid-template-columns: 24px 1fr auto; }
.drop .gempick { align-self: stretch; }
.gemrow .gmain { min-width: 0; font-size: 12px; }
.gemrow .gtext { display: block; }
.enh { position: absolute; right: 2px; top: 0; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 #000, 0 0 3px #000; font-variant-numeric: tabular-nums; }
.enh.warn { color: var(--danger); top: auto; bottom: 12px; }
.bag { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px 6px; }
.cell { --rc: var(--line); background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; color: var(--parch); }
.cicon { position: relative; width: 50px; height: 50px; display: grid; place-items: center; background: #17121a; border: 2px solid var(--rc); }
.cicon img { width: 34px; height: 34px; image-rendering: pixelated; image-rendering: crisp-edges; }
.cell small { font-size: 10px; line-height: 1.25; text-align: center; color: var(--rc); max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.eqtag { position: absolute; left: 0; bottom: 0; font-style: normal; font-size: 9px; line-height: 1.2; padding: 0 3px; background: var(--gilt); color: var(--ink); }
.ddetail { border-color: var(--gilt-dim); }
.cmp { border-top: 1px dashed var(--line); padding-top: 8px; opacity: 0.75; display: flex; flex-direction: column; gap: 4px; }

/* 铁匠铺：强化台 */
.scroll > * { flex-shrink: 0; }
.crybar { display: flex; gap: 6px; flex-wrap: wrap; }
.crychip span { white-space: nowrap; }
.crychip { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); padding: 6px 8px; font-size: 12px; }
.crychip b { font-family: var(--display); font-size: 15px; margin-right: auto; font-variant-numeric: tabular-nums; }
.crychip .mini { padding: 3px 6px; font-size: 11px; }
.wpick { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
.forge { --glow: transparent; align-items: stretch; text-align: center; border-color: var(--gilt-dim); overflow: hidden; }
.forge .bonus { text-align: left; }
.anvil { position: relative; height: 176px; margin: 0 auto; width: 100%; max-width: 260px; }
.fplat { position: absolute; left: 50%; bottom: 14px; width: 190px; height: 46px; margin-left: -95px; border-radius: 50%; background: radial-gradient(closest-side, #4a4350, #2a2530 70%, #17121a); border: 2px solid #6a6272; box-shadow: 0 6px 0 #17121a, 0 0 26px var(--glow); }
.frune { position: absolute; left: 50%; bottom: 20px; width: 150px; height: 34px; margin-left: -75px; border-radius: 50%; border: 2px dashed var(--rc); opacity: 0.7; animation: frune 9s linear infinite; }
.fw { position: absolute; left: 50%; top: 14px; width: 126px; height: 126px; margin-left: -63px; image-rendering: pixelated; image-rendering: crisp-edges; filter: drop-shadow(0 0 7px var(--glow)); }
.fhalf { position: absolute; top: 14px; width: 63px; height: 126px; overflow: hidden; visibility: hidden; }
.fhalf.fl { left: calc(50% - 63px); }
.fhalf.fr { left: 50%; }
.fhalf img { display: block; width: 126px; height: 126px; max-width: none; image-rendering: pixelated; image-rendering: crisp-edges; }
.fhalf.fr img { margin-left: -63px; }
.fhammer { position: absolute; right: 8px; top: 0; width: 76px; height: 76px; image-rendering: pixelated; image-rendering: crisp-edges; transform-origin: 20% 85%; transform: rotate(18deg); opacity: 0.9; }
.fflash { position: absolute; left: 50%; top: 77px; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; opacity: 0; pointer-events: none; }
.fsparks { position: absolute; left: 50%; top: 80px; }
.fsparks i { position: absolute; width: 4px; height: 4px; margin: -2px; background: #ffe27a; opacity: 0; }
.fname { font-size: 20px; }
.fname b { font-family: var(--display); color: #fff; }
.fresult { min-height: 1.5em; font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: 0.2em; }
@keyframes frune { to { transform: rotate(360deg); } }
/* 敲打 */
.hammering .fhammer { animation: fstrike 0.33s ease-in 3; }
.hammering .fw.whole { animation: fjolt 0.33s linear 3; }
.hammering .fsparks i { animation: fspark 0.33s linear 3; }
@keyframes fstrike { 0% { transform: rotate(18deg); } 55% { transform: rotate(-58deg) translate(-26px, 30px); } 70% { transform: rotate(-58deg) translate(-26px, 30px); } 100% { transform: rotate(18deg); } }
@keyframes fjolt { 0%, 50% { transform: none; filter: drop-shadow(0 0 7px var(--glow)); } 62% { transform: translateY(4px) scale(1.04, 0.96); filter: brightness(2.2); } 100% { transform: none; } }
@keyframes fspark { 0%, 55% { opacity: 0; transform: rotate(var(--a)) translateX(4px); } 60% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(calc(var(--d) * 0.6)); } }
/* 成功：金光炸开，武器放大一下 */
.fx-success .fflash { background: radial-gradient(#fff, #ffd76b 40%, transparent 70%); animation: fburst 0.9s ease-out; }
.fx-success .fw.whole { animation: fpop 0.9s ease-out; }
.fx-success .fsparks i { animation: ffly 0.9s ease-out; }
.fx-success .fresult { color: var(--gilt); animation: frise 0.5s ease-out; }
.fx-success .fname b { animation: fnum 0.9s ease-out; }
@keyframes fburst { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(30); } }
@keyframes fpop { 0% { transform: scale(1); filter: brightness(3); } 35% { transform: scale(1.3); filter: brightness(2) drop-shadow(0 0 16px #ffd76b); } 100% { transform: scale(1); } }
@keyframes ffly { 0% { opacity: 1; transform: rotate(var(--a)) translateX(6px); } 100% { opacity: 0; transform: rotate(var(--a)) translateX(calc(var(--d) * 1.9)); } }
@keyframes frise { 0% { opacity: 0; transform: translateY(10px) scale(0.8); } 100% { opacity: 1; transform: none; } }
@keyframes fnum { 0% { color: #ffd76b; transform: scale(2); display: inline-block; } 100% { color: #fff; } }
/* 失败：一股灰烟，武器晃两下 */
.fx-fail .fflash { background: radial-gradient(#9a94a0, #5a5560 50%, transparent 72%); animation: fsmoke 1s ease-out; }
.fx-fail .fw.whole { animation: fshake 0.5s linear; filter: grayscale(0.8) brightness(0.7); }
.fx-fail .fresult { color: var(--muted); animation: frise 0.4s ease-out; }
@keyframes fsmoke { 0% { opacity: 0.9; transform: scale(2); } 100% { opacity: 0; transform: scale(16) translateY(-3px); } }
@keyframes fshake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px) rotate(-3deg); } 40% { transform: translateX(6px) rotate(3deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
/* 掉级：红光，武器往下一沉 */
.fx-down .fflash { background: radial-gradient(#ff9a8a, #d4553a 45%, transparent 72%); animation: fburst 0.8s ease-out; }
.fx-down .fw.whole { animation: fsink 0.8s ease-out; }
.fx-down .fresult { color: var(--danger); animation: frise 0.4s ease-out; }
.fx-down .fname b { color: var(--danger); animation: fdrop 0.8s ease-out; display: inline-block; }
@keyframes fsink { 0% { transform: none; filter: brightness(2) sepia(1) hue-rotate(-40deg) saturate(4); } 40% { transform: translateY(14px) scale(0.92); } 100% { transform: none; } }
@keyframes fdrop { 0% { transform: translateY(-14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
/* 损坏：武器裂成两半掉下去，整个台子震动 */
.fx-break .anvil { animation: fquake 0.6s linear; }
.fx-break .fflash { background: radial-gradient(#fff, #e0664a 35%, transparent 70%); animation: fburst 1s ease-out; }
.fx-break .fw.whole { visibility: hidden; }
.fx-break .fhalf { visibility: visible; }
.fx-break .fhalf.fl { animation: fsplitl 1.3s cubic-bezier(0.3, 0, 0.8, 0.6) forwards; }
.fx-break .fhalf.fr { animation: fsplitr 1.3s cubic-bezier(0.3, 0, 0.8, 0.6) forwards; }
.fx-break .fsparks i { background: #e0664a; animation: ffly 0.8s ease-out; }
.fx-break .fresult { color: var(--danger); font-size: 26px; animation: frise 0.4s ease-out; }
@keyframes fsplitl { 0% { transform: none; } 15% { transform: translate(-6px, -4px) rotate(-6deg); } 100% { transform: translate(-46px, 70px) rotate(-70deg); opacity: 0; } }
@keyframes fsplitr { 0% { transform: none; } 15% { transform: translate(6px, -4px) rotate(6deg); } 100% { transform: translate(46px, 70px) rotate(70deg); opacity: 0; } }
@keyframes fquake { 0%, 100% { transform: none; } 10% { transform: translate(-6px, 3px); } 25% { transform: translate(6px, -3px); } 40% { transform: translate(-5px, -2px); } 55% { transform: translate(5px, 2px); } 75% { transform: translate(-2px, 1px); } }
@media (prefers-reduced-motion: reduce) { .forge *, .forge { animation: none !important; } .fx-break .fw.whole { visibility: visible; filter: grayscale(1) brightness(0.6); } .fx-break .fhalf { visibility: hidden; } }
.ghead { display: flex; gap: 12px; align-items: flex-start; }
.gtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.gglyph { font-family: var(--display); font-size: 24px; }
.gprice { margin-right: auto; align-self: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.goods .invact { justify-content: flex-start; align-items: center; }
.goods.rare1 { border-color: #b77bff; box-shadow: 0 0 14px rgba(183, 123, 255, 0.35); }
.goods.rare2 { border-color: #ff9a2e; box-shadow: 0 0 20px rgba(255, 154, 46, 0.5); }
.goods.sold { opacity: 0.5; box-shadow: none; }
.hl .dot.star { color: #ffd76b; }
.drop.legend { border-color: #ff9a2e; box-shadow: 0 0 18px rgba(255, 154, 46, 0.45); }

/* 战斗 HUD */
#hud { pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #000, 0 0 4px #000; }
#hud button { pointer-events: auto; text-shadow: none; }
.xpbar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: rgba(0, 0, 0, 0.55); }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7fe6ff, #d8f6ff); }
.hudrow { position: absolute; top: 12px; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 13px; }
#timer { font-family: var(--display); font-size: 24px; font-weight: 900; letter-spacing: 0.04em; }
#timer.warn { font-size: 15px; color: var(--danger); }
#kills { text-align: right; padding-right: 44px; }
#pausebtn { position: absolute; top: 10px; right: max(16px, env(safe-area-inset-right, 0px)); width: 34px; height: 34px; background: rgba(18, 14, 20, 0.7); border: 1px solid var(--gilt-dim); font-size: 13px; letter-spacing: 2px; }
#bossbar { position: absolute; top: 50px; left: 0; right: 0; }
#bossbar b { font-family: var(--display); font-size: 14px; color: var(--parch); letter-spacing: 0.2em; }
#bossbar .bar { height: 8px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--gilt-dim); margin-top: 3px; }
#bossbar .bar i { display: block; height: 100%; background: linear-gradient(#f0795c, #b23a2a); }
#traits { position: absolute; top: 84px; left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-shadow: none; }
#lootcount { position: absolute; top: 50px; right: max(16px, env(safe-area-inset-right, 0px)); font-size: 12px; color: var(--gilt); }
#bossbar:not([hidden]) ~ #lootcount { top: 84px; }
#bossbar:not([hidden]) ~ #traits { top: 104px; }
#banner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: 20px; letter-spacing: 0.3em; color: var(--parch); opacity: 0; transition: opacity 0.3s; }
#banner.show { opacity: 1; }
#banner small { display: block; margin-top: 6px; font-size: 13px; font-weight: 400; letter-spacing: 0.05em; color: var(--parch); text-shadow: 0 1px 0 #000, 0 0 6px #000; }
#banner.big { font-size: 30px; font-weight: 900; color: var(--gilt); }
#skills { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 18px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 62%; }
.ic { --c: var(--muted); position: relative; width: 28px; height: 28px; display: grid; place-items: center; background: rgba(18, 14, 20, 0.78); border: 1px solid var(--c); color: var(--c); font-family: var(--display); font-size: 15px; }
.ic sub { position: absolute; right: 1px; bottom: -2px; font-size: 9px; color: var(--parch); font-family: var(--body); }
.ic.pas { border-style: dashed; }
.ic.max { background: color-mix(in srgb, var(--c) 30%, #120e14); color: #fff; }
#mountbtn { --cd: 0deg; position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 20px; width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--gilt-dim); background: conic-gradient(rgba(10, 8, 12, 0.82) var(--cd), rgba(216, 181, 106, 0.28) 0); font-family: var(--display); font-size: 16px; color: var(--parch); }
#autobtn { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 100px; width: 72px; padding: 4px 0; border-radius: 999px; border: 1px solid var(--gilt-dim); background: rgba(18, 14, 20, 0.78); color: var(--muted); font-size: 12px; }
#autobtn.on { background: linear-gradient(#f3d995, #bf9548); border-color: #f8e7b6; color: #20160c; font-weight: 700; }
#mountbtn.auto::after { content: "自动"; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); font-family: var(--body); font-size: 10px; line-height: 1.3; padding: 0 5px; border-radius: 999px; background: var(--gilt); color: var(--ink); }
#mountbtn.ready { border-color: var(--gilt); box-shadow: 0 0 14px rgba(216, 181, 106, 0.55); color: #fff; }
#joy { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 1px solid rgba(239, 227, 198, 0.4); background: rgba(18, 14, 20, 0.25); }
#joy i { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: rgba(239, 227, 198, 0.55); }
#hint { position: absolute; left: 0; right: 0; bottom: 112px; text-align: center; font-size: 13px; color: var(--parch); }

/* 弹窗 */
#modal { background: rgba(10, 8, 12, 0.74); display: flex; align-items: center; justify-content: center; padding-block: 16px; touch-action: pan-y; }
.sheet { width: 100%; max-width: 400px; max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--gilt-dim); box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 4px rgba(216, 181, 106, 0.3); padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
.sheet h2 { font-family: var(--display); font-weight: 900; font-size: 26px; text-align: center; letter-spacing: 0.3em; text-indent: 0.3em; color: var(--gilt); text-wrap: balance; }
.sheet h2.lose { color: var(--danger); }
.sheet .sub { text-align: center; }
.pick { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--panel-2); border: 1px solid var(--line); padding: 11px 12px; }
.pick.evo { border-color: var(--gilt); background: linear-gradient(90deg, rgba(216, 181, 106, 0.2), var(--panel-2) 60%); }
.glyph { --c: var(--muted); flex: none; width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--c); color: var(--c); background: var(--ink); font-family: var(--display); font-size: 24px; }
.glyph.pas { border-style: dashed; }
.pk { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pk b { font-family: var(--display); font-size: 16px; }
.pk em { font-style: normal; font-family: var(--body); font-weight: 400; font-size: 11px; color: var(--gilt); margin-left: 4px; }
.pk small { font-size: 13px; color: var(--parch); opacity: 0.86; }
.tags { display: flex; gap: 4px; }
.tags i { font-style: normal; font-size: 10px; color: var(--muted); border: 1px solid var(--line); padding: 0 4px; }
.stats { display: flex; justify-content: space-around; text-align: center; border-top: 1px solid var(--line); padding-top: 10px; }
.stats dt { font-size: 11px; color: var(--muted); }
.stats dd { font-family: var(--display); font-size: 21px; font-variant-numeric: tabular-nums; }
.drop { background: var(--panel-2); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.drop.new { border-color: var(--gilt); }
.drop .item { width: 100%; }
.plain { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.plain b { color: var(--parch); font-weight: 400; }
@media (prefers-reduced-motion: reduce) { #banner { transition: none; } }

/* ---------- 质感：按钮、面板、图标格子 ---------- */
button { -webkit-tap-highlight-color: transparent; transition: transform 0.07s ease-out, filter 0.07s ease-out; }
button:not(:disabled):active { transform: scale(0.94); filter: brightness(1.3); }
.mini { background: linear-gradient(#3b303a, #231a23); border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 2px 0 rgba(0, 0, 0, 0.5); display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
